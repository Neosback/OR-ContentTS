[package]
name = "openrune-core"
version = "0.1.0"
edition = "2021"
description = "Hot-path kernels for the OpenRune Content Studio client, compiled to WebAssembly. Every kernel has a TypeScript reference implementation and parity tests."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-opt is run by scripts/build-wasm.sh so the build does not download a binaryen release.
wasm-opt = false

name: Backend validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle.properties
            backend/gradle/wrapper/gradle-wrapper.properties
            backend/Protocol/*.gradle
            backend/StudioService/*.gradle

      - name: Compile backend
        timeout-minutes: 8
        run: ./gradlew :Protocol:classes :StudioService:classes --no-daemon --stacktrace

      - name: Test protocol
        timeout-minutes: 5
        run: ./gradlew :Protocol:test --no-daemon --stacktrace

      - name: Test StudioService
        timeout-minutes: 10
        run: ./gradlew :StudioService:test --no-daemon --stacktrace

      - name: Build runnable distribution
        timeout-minutes: 7
        run: ./gradlew :StudioService:installDist --no-daemon --stacktrace

name: Temporary mesh-placement benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-terrain-bench.yml"
      - "client/src/wasm/mesh-packer*"
      - "client/src/mapviewer/webgl/buffer/SceneBuffer.ts"

jobs:
  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Mesh placement micro-benchmark
        run: BENCH=1 npx vitest run src/wasm/mesh-packer.bench.test.ts --reporter=verbose

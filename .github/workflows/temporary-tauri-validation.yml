name: Temporary Tauri validation

on:
  push:
    branches:
      - feat/tauri-project-filesystem
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path client/src-tauri/Cargo.toml

name: Temporary Rust/WASM branch build

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/native/openrune-core/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/rust-terrain-pack
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack and wasm-opt
        run: |
          cargo install wasm-pack --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build committed WASM bundle
        run: |
          cd client
          ( cd native && wasm-pack build openrune-core --target web --release --no-pack --out-dir ../../src/wasm/openrune-core --out-name openrune_core )
          rm -f src/wasm/openrune-core/.gitignore src/wasm/openrune-core/package.json src/wasm/openrune-core/README.md
          wasm-opt -O3 --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types src/wasm/openrune-core/openrune_core_bg.wasm -o src/wasm/openrune-core/openrune_core_bg.wasm

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- client/src/wasm/openrune-core; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/wasm/openrune-core
          git commit -m "build: regenerate OpenRune WASM bundle"
          git fetch origin perf/rust-terrain-pack
          git rebase origin/perf/rust-terrain-pack
          git push origin HEAD:perf/rust-terrain-pack

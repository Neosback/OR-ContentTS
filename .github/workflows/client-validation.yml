name: Client validation

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Svelte-only client boundary
        run: npm run check:ui-boundaries

      - name: Svelte check
        run: npm run check

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Vite build
        run: npm run build


  tauri-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Cargo lock
        run: cargo generate-lockfile --manifest-path client/src-tauri/Cargo.toml

      - name: Cargo check locked
        run: cargo check --manifest-path client/src-tauri/Cargo.toml --locked

      - name: Commit generated Cargo lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(tauri): lock persisted scope dependency"
          git push origin HEAD:${{ github.head_ref }}

name: Client validation

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Svelte check
        continue-on-error: true
        run: npm run check

      - name: TypeScript
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Vite build
        run: npm run build
